<!doctype html>
<meta charset="utf-8">
<title>Copy review — redirecting</title>
<!--
  The review board is one page shared by every prototype: it queries all of
  them and filters by the Prototype column, so a copy per repo would be the
  same page twice and would drift the moment one is fixed. This redirect
  keeps the per-prototype URL working without creating that second copy.
-->
<meta http-equiv="refresh" content="0; url=https://oliviadiss.github.io/Trin/review.html">
<link rel="canonical" href="https://oliviadiss.github.io/Trin/review.html">
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 3rem auto; max-width: 34rem; padding: 0 1rem; }
</style>
<p>The copy review board covers every prototype at once.
   Taking you to <a href="https://oliviadiss.github.io/Trin/review.html">the review board</a>…</p>
<script>location.replace('https://oliviadiss.github.io/Trin/review.html');</script>
